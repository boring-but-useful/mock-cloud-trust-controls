evidence_items:
  - evidence_id: EV-IAM-001
    control_id: MCTC-IAM-01
    provider: aws
    scope: account/example-production
    environment: production
    resource_ref: aws://iam/example-production/role/platform-admin
    source_system: AWS IAM
    collection_method: Exported privileged roles and attached policies.
    collection_date: 2026-07-15
    owner: Security / Platform
    status: pass
    summary: Sample privileged roles have owners, approvals, and current business reasons.
  - evidence_id: EV-IAM-002
    control_id: MCTC-IAM-02
    provider: common
    scope: organization/example-company
    environment: production
    resource_ref: common://identity/production-cloud-access
    source_system: Identity provider
    collection_method: Exported production cloud access groups and MFA policy.
    collection_date: 2026-07-15
    owner: Security / IT
    status: needs_review
    summary: Central authentication is in place; one break-glass account requires recurring review evidence.
  - evidence_id: EV-LOG-001
    control_id: MCTC-LOG-01
    provider: aws
    scope: organization/example-cloud
    environment: production
    resource_ref: aws://cloudtrail/example-cloud/organization-trail
    source_system: AWS CloudTrail
    collection_method: Exported organization trail settings, event selectors, encryption, and log-file validation configuration.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: The synthetic organization trail is multi-Region, covers member accounts, records read and write management events, uses SSE-KMS, and has log-file validation enabled.
  - evidence_id: EV-LOG-002
    control_id: MCTC-LOG-01
    provider: aws
    scope: organization/example-cloud
    environment: production
    resource_ref: aws://s3/example-log-archive/cloudtrail
    source_system: Amazon S3
    collection_method: Exported public-access, bucket-policy, versioning, encryption, and lifecycle-retention settings for the central log archive.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: needs_review
    summary: The synthetic archive is private, source-restricted, encrypted, and versioned, but its 180-day lifecycle is shorter than the documented 365-day retention requirement.
  - evidence_id: EV-LOG-003
    control_id: MCTC-LOG-01
    provider: common
    scope: organization/example-cloud
    environment: production
    resource_ref: common://siem/example-cloud/cloudtrail-ingestion
    source_system: SIEM or logging platform
    collection_method: Compared recent CloudTrail delivery timestamps with SIEM ingestion timestamps across sampled production accounts and Regions.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: Sampled management events arrived within the synthetic ingestion objective, with no unexplained account or Region gaps during the review window.
  - evidence_id: EV-LOG-004
    control_id: MCTC-LOG-01
    provider: common
    scope: organization/example-cloud
    environment: production
    resource_ref: common://siem/example-cloud/administrative-event-query
    source_system: SIEM or logging platform
    collection_method: Ran a saved, timestamped query for role-assumption and trail-configuration events and retained the synthetic result reference.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: The saved query returned expected administrative events with account, Region, actor, source, and event-time fields available for investigation.
  - evidence_id: EV-LOG-005
    control_id: MCTC-LOG-01
    provider: gcp
    scope: organization/example-google-cloud
    environment: production
    resource_ref: gcp://logging/example-google-cloud/audit-config
    source_system: Google Cloud Audit Logs
    collection_method: Exported organization audit configuration and sampled Admin Activity, System Event, Policy Denied, and Data Access settings for critical services.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: needs_review
    summary: Required audit logs are present and Data Access is enabled for designated services, but a newly adopted service lacks inherited DATA_READ coverage and needs owner and cost review.
  - evidence_id: EV-LOG-006
    control_id: MCTC-LOG-01
    provider: gcp
    scope: organization/example-google-cloud
    environment: production
    resource_ref: gcp://logging/example-google-cloud/sink/central-audit
    source_system: Google Cloud Log Router
    collection_method: Exported organization aggregated-sink scope, filters, exclusions, destination, writer identity, and destination IAM binding.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: The non-intercepting organization sink includes child resources, routes all audit-log types to the central project, has no security-log exclusions, and its dedicated writer can reach the destination.
  - evidence_id: EV-LOG-007
    control_id: MCTC-LOG-01
    provider: gcp
    scope: project/example-central-logging
    environment: production
    resource_ref: gcp://logging/example-central-logging/bucket/central-audit
    source_system: Google Cloud Logging
    collection_method: Exported central log-bucket location, retention period, lock state, encryption setting, and bucket-level IAM access.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: The synthetic central bucket uses 365-day locked retention, customer-managed encryption, and restricted viewer access in the designated logging project.
  - evidence_id: EV-LOG-008
    control_id: MCTC-LOG-01
    provider: gcp
    scope: organization/example-google-cloud
    environment: production
    resource_ref: gcp://monitoring/example-google-cloud/log-router-health
    source_system: Google Cloud Logging and Cloud Monitoring
    collection_method: Reviewed sink entry and error metrics, then ran a timestamped Logs Explorer query against the central audit-log view.
    collection_date: 2026-09-18
    owner: Security / Platform
    status: pass
    summary: The sampled sink shows routed entries without export errors, and the central query returns expected actor, resource, service, method, and event-time fields.
  - evidence_id: EV-IAC-001
    control_id: MCTC-IAC-01
    provider: common
    scope: organization/example-company
    environment: shared
    resource_ref: common://source-control/infrastructure
    source_system: Source control and CI/CD
    collection_method: Sampled merged pull requests, workflow runs, and Terraform plan output.
    collection_date: 2026-07-15
    owner: Platform
    status: pass
    summary: Sampled infrastructure changes include code review and deployment evidence.
  - evidence_id: EV-NET-001
    control_id: MCTC-NET-01
    provider: aws
    scope: account/example-production
    environment: production
    resource_ref: aws://config/example-production/public-exposure
    source_system: AWS Config
    collection_method: Exported internet exposure findings and linked approval records.
    collection_date: 2026-07-15
    owner: Security / Platform / Application team
    status: needs_review
    summary: Most sampled public exposure has owners; one route requires refreshed approval.
  - evidence_id: EV-EVD-001
    control_id: MCTC-EVD-01
    provider: common
    scope: organization/example-company
    environment: shared
    resource_ref: common://repository/mock-cloud-trust-controls
    source_system: Control framework repository
    collection_method: Reviewed control-to-evidence mapping and generated report output.
    collection_date: 2026-07-15
    owner: Security / Compliance / Platform
    status: pass
    summary: Sample evidence includes source system, collection method, date, owner, and reviewer path.
  - evidence_id: EV-VULN-001
    control_id: MCTC-VULN-01
    provider: aws
    scope: account/example-production
    environment: production
    resource_ref: aws://security-hub/example-production/findings
    source_system: AWS Security Hub
    collection_method: Exported vulnerability findings with severity, owner, age, and status.
    collection_date: 2026-07-15
    owner: Security / Platform / Application team
    status: needs_review
    summary: Critical and high findings are tracked; two medium findings require owner confirmation.
  - evidence_id: EV-COST-001
    control_id: MCTC-COST-01
    provider: common
    scope: organization/example-company
    environment: shared
    resource_ref: common://cost-reporting/monthly-allocation
    source_system: Cloud cost reporting pipeline
    collection_method: Calculated allocated, shared, and unallocated amortized spend for the review month.
    collection_date: 2026-09-18
    owner: Platform / Finance
    status: needs_review
    summary: Ninety-two percent of sampled spend is allocated; shared observability costs still need an approved allocation rule.
  - evidence_id: EV-COST-002
    control_id: MCTC-COST-02
    provider: aws
    scope: organization/example-cloud
    environment: production
    resource_ref: aws://budgets/example-cloud/production-monthly
    source_system: AWS Budgets and Cost Anomaly Detection
    collection_method: Reviewed budget thresholds, subscribers, anomaly monitors, and one closed cost-variance alert.
    collection_date: 2026-09-18
    owner: Platform / Finance
    status: pass
    summary: Production budgets and anomaly notifications route to accountable owners, and the sampled variance had a documented disposition.
  - evidence_id: EV-COST-003
    control_id: MCTC-COST-03
    provider: aws
    scope: account/example-production
    environment: production
    resource_ref: aws://cost-optimization/example-production/recommendations
    source_system: AWS Cost Optimization Hub and Compute Optimizer
    collection_method: Reviewed prioritized recommendations against utilization, reliability context, and change records.
    collection_date: 2026-09-18
    owner: Platform / Finance / Service owners
    status: needs_review
    summary: Low-risk cleanup candidates are approved; a database rightsizing recommendation is deferred pending peak-load validation.
