exceptions:
  - exception_id: EX-IAM-001
    control_id: MCTC-IAM-02
    title: Break-glass IAM user retained for recovery testing
    owner: Security / IT
    reason: A restricted emergency user is retained for account recovery testing.
    compensating_control: Credentials are vaulted, MFA is enforced, and use is monitored.
    approved_by: Security reviewer
    expires_on: 2027-09-18
    status: approved
  - exception_id: EX-NET-001
    control_id: MCTC-NET-01
    title: Temporary public endpoint for vendor validation
    owner: Application team
    reason: A vendor validation endpoint must remain public during integration testing.
    compensating_control: Source CIDR is restricted and access logs are reviewed weekly.
    approved_by: Security reviewer
    expires_on: 2026-08-15
    status: expired
  - exception_id: EX-VULN-001
    control_id: MCTC-VULN-01
    title: Medium dependency finding awaiting upstream patch
    owner: Application team
    reason: The affected package has no fixed version yet.
    compensating_control: Feature path is not internet-exposed and runtime monitoring is enabled.
    approved_by: Security reviewer
    expires_on: 2026-09-15
    status: expired
  - exception_id: EX-COST-001
    control_id: MCTC-COST-03
    title: Synthetic transaction database retains peak-capacity headroom
    owner: Platform / Finance / Application team
    reason: Rightsizing is deferred until representative peak-load and failover tests confirm safe capacity thresholds.
    compensating_control: Utilization and latency are monitored, the cost impact is reviewed monthly, and the recommendation remains tracked with an accountable owner.
    approved_by: Platform and finance reviewer
    expires_on: 2026-12-31
    status: approved
