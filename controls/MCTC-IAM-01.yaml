control_id: MCTC-IAM-01
domain: Identity and access
title: Privileged Access Is Restricted
objective: Limit privileged access to approved users and roles.
requirement: Privileged access to production cloud accounts must be granted only through approved roles, use least privilege, and have a documented business reason.
risk: Over-broad privileged access increases the chance of accidental changes, data exposure, and unauthorized administrative action.
evidence_sources:
  - name: IAM role inventory
    system: AWS IAM
    collection_method: Export privileged role list and attached policies.
  - name: SSO group membership
    system: Identity provider
    collection_method: Export production administrator groups.
  - name: Access review record
    system: GRC or ticketing system
    collection_method: Link the latest quarterly access review.
  - name: Approval record
    system: Ticketing system
    collection_method: Link business justification and approver.
test_method: Review privileged roles and confirm each assignment has an owner, approval, and current business need.
owner: Security / Platform
review_cadence: Quarterly
automation_status: Partial
exception_allowed: true
exception_requirements:
  - Named owner
  - Business reason
  - Expiry date
  - Compensating control
related_frameworks:
  - SOC 2 style
  - ISO 27001 style
  - CIS style
tags:
  - iam
  - privileged-access
  - access-review
