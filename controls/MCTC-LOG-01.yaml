control_id: MCTC-LOG-01
domain: Logging and monitoring
title: Cloud Audit Logs Are Enabled And Retained
objective: Maintain a reliable audit trail for cloud activity.
requirement: Production cloud accounts must collect audit logs for administrative and security-relevant events. Logs must be retained long enough to support investigation and compliance review.
risk: Missing or short-lived audit logs limit incident investigation and make control evidence harder to defend.
evidence_sources:
  - name: CloudTrail configuration
    provider: aws
    system: AWS CloudTrail
    collection_method: Export trail configuration and account coverage.
  - name: Log bucket retention policy
    provider: aws
    system: AWS S3
    collection_method: Export lifecycle and object lock configuration where applicable.
  - name: Cloud Audit Logs configuration
    provider: gcp
    system: Google Cloud Audit Logs
    collection_method: Export organization audit configuration and enabled log types, including Data Access coverage and exemptions.
  - name: Organization aggregated log sink
    provider: gcp
    system: Google Cloud Log Router
    collection_method: Export sink scope, filters, exclusions, destination, writer identity, and destination permissions.
  - name: Central log bucket retention
    provider: gcp
    system: Google Cloud Logging
    collection_method: Export bucket location, retention, lock, encryption, and access settings.
  - name: Sink health and sample query
    provider: gcp
    system: Google Cloud Logging and Cloud Monitoring
    collection_method: Review export metrics and run a timestamped audit-log query against the central destination.
  - name: SIEM ingestion status
    provider: common
    system: SIEM or logging platform
    collection_method: Query recent administrative events by account.
  - name: Sample event query
    provider: common
    system: SIEM or logging platform
    collection_method: Save source query and timestamped result.
test_method: Confirm audit logging is enabled, expected log types and resources are covered, routing exclusions are justified, destination permissions work, retention meets policy, and events are queryable.
owner: Security / Platform
review_cadence: Monthly
automation_status: Partial
exception_allowed: false
exception_requirements:
  - Production exceptions are not allowed.
  - Temporary ingestion failures require incident or maintenance records.
related_frameworks:
  - SOC 2 style
  - ISO 27001 style
  - NIST style
tags:
  - logging
  - cloudtrail
  - retention
  - siem
